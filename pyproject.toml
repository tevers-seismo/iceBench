[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iceBench"
version = "1.0"
description = "Icequake detection, picking, association and location with pretrained SeisBench phase pickers, PyOcto and NonLinLoc"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Therese Evers" }]
requires-python = ">=3.10"
dependencies = [
    "seisbench==0.11.7",
    "pyocto==0.1.10",
    "obspy",
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "matplotlib",
]

[project.urls]
Repository = "https://github.com/tevers-seismo/iceBench"

[tool.setuptools]
packages = ["iceBench"]
